[package]
name = "xdg-desktop-portal-atrium"
description = "xdg-desktop-portal backend with a narrow runtime bridge for Tessera compositor resources"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atrium-portal-apps = { workspace = true }
atrium-portal-cast = { workspace = true }
atrium-portal-ipc = { workspace = true }
atrium-arca-contract = { workspace = true }
atrium-portal-request = { workspace = true }
atrium-portal-secret = { workspace = true }
# Session D-Bus bridge: pure-Rust zbus with the blocking API so the service
# stays on a plain `std::thread` model without an async runtime.
zbus = { workspace = true }
async-channel = { workspace = true }
futures-util = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Account portal: getpwuid for the account id and GECOS real name.
libc = { workspace = true }

[dev-dependencies]
# The PipeWire E2E consumer links the system binding directly; production
# code reaches it only through atrium-portal-cast.
pipewire = { version = "0.10", features = ["v0_3_34"] }
# Independent wire-format fixtures keep the assembled daemon tests from
# trusting the secret implementation under test.
atrium-portal-ipc = { workspace = true, features = ["test-server"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
name = "atrium_portal"
path = "src/lib.rs"
