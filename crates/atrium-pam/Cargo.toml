[package]
name = "atrium-pam"
description = "PAM module caching the login authtok for the Tessera secret vault's auto-unlock (token consumed by xdg-desktop-portal-atrium) and re-keying the vault on login password changes"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
name = "pam_atrium"

[dependencies]
atrium-portal-secret.workspace = true
libc = { workspace = true }
zeroize = { workspace = true }
