[preferred]
# Tessera is the sole, full-stack backend: every interface below is served
# natively by xdg-desktop-portal-atrium, and the default routes to Tessera
# alone. Interfaces outside the atrium.portal list (Camera, RemoteDesktop,
# GlobalShortcuts, InputCapture, USB, …) have no backend in this stack and
# fail cleanly at the frontend. No external fallback backend is installed
# or required.
default=atrium
org.freedesktop.impl.portal.Settings=atrium
org.freedesktop.impl.portal.Screenshot=atrium
org.freedesktop.impl.portal.ScreenCast=atrium
# Inhibit is backed by logind for idle (8) and suspend (4, as "sleep"),
# always in "block" mode; a logind failure fails the D-Bus method. Logout
# (1) and user-switch (2) have no session-manager equivalent in this stack
# and are tracked no-ops — see the inhibit module docs.
org.freedesktop.impl.portal.Inhibit=atrium
# Secret retrieval is served entirely by Tessera (at-rest vault, no frontend
# UI involved), so no fallback is needed.
org.freedesktop.impl.portal.Secret=atrium
# Lockdown is a stateless all-permissive policy query; no fallback needed.
org.freedesktop.impl.portal.Lockdown=atrium
# FileChooser is owned by this backend and rendered in its supervised,
# one-shot optics (iris/lens) prompter. Tessera only supplies xdg-foreign
# window parenting.
org.freedesktop.impl.portal.FileChooser=atrium
# Email hands the message to the session mail client via xdg-email (no UI of
# its own).
org.freedesktop.impl.portal.Email=atrium
# Access is the generic frontend-driven consent dialog; the backend renders
# the supplied text and labels with the same prompter surface as Account.
org.freedesktop.impl.portal.Access=atrium
# AppChooser is a Portal-owned chooser dialog: the backend resolves real
# desktop entries and mimeapps.list associations itself and renders the
# one-shot prompter. Live UpdateChoices calls are acknowledged but not
# rendered (the prompter cannot mutate an open dialog) — see the
# app_chooser module docs.
org.freedesktop.impl.portal.AppChooser=atrium
# OpenURI resolves content types (shared-mime-info globs) and default
# applications (mimeapps.list) in-process, launches the resolved app, and
# reuses the AppChooser dialog when the user must pick. No fallback.
org.freedesktop.impl.portal.OpenURI=atrium
# Background consent is a Portal-owned confirmation prompt; the autostart
# grant writes $XDG_CONFIG_HOME/autostart/<app_id>.desktop directly. No
# permission-store persistence: the prompt appears on every request.
org.freedesktop.impl.portal.Background=atrium
# Notifications are rendered by the Portal-owned prompter in daemon mode
# (one "Notifications" window stacking cards; the optics stack has no
# borderless always-on-top surface). Text and buttons only — icons, sounds,
# and action targets are accepted and ignored (see the notification module
# docs).
org.freedesktop.impl.portal.Notification=atrium
# Account answers only after a Portal-owned consent prompt.
org.freedesktop.impl.portal.Account=atrium
# DynamicLauncher's backend surface is only the install-confirmation dialog
# (the frontend writes the .desktop file); Tessera renders it with the
# Portal-owned launcher editor prompter. Install tokens are never issued:
# every install passes the dialog.
org.freedesktop.impl.portal.DynamicLauncher=atrium
# Wallpaper application is compositor-owned: the portal stages the image
# under its runtime directory and hands the path to the compositor's scoped
# IPC SetWallpaper op (available since long before the protocol-24 floor),
# whose reply is the authoritative decode-and-swap receipt.
org.freedesktop.impl.portal.Wallpaper=atrium
# Print spools the document to a 0600 temp file and submits it to the
# default printer via the system `lp` client (the xdg-email hand-off
# precedent). No printer dialog: PreparePrint echoes settings with a fresh
# token; without `lp`, Print answers 2.
org.freedesktop.impl.portal.Print=atrium
