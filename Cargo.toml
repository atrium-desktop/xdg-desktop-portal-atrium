[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.36"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/atrium-desktop/xdg-desktop-portal-atrium"

[workspace.dependencies]
atrium-portal-ipc = { version = "=0.0.36", path = "crates/atrium-portal-ipc" }
atrium-portal-apps = { version = "=0.0.36", path = "crates/atrium-portal-apps" }
atrium-portal-cast = { version = "=0.0.36", path = "crates/atrium-portal-cast" }
atrium-portal-request = { version = "=0.0.36", path = "crates/atrium-portal-request" }
atrium-arca-contract = { version = "=0.0.36", path = "crates/atrium-arca-contract" }
atrium-portal-secret = { version = "=0.0.36", path = "crates/atrium-portal-secret" }

dirs = "5"
env_logger = "0.11"
# Everything below is inherited by more than one crate; deny.toml audits
# the workspace table as the single pinning point, so member manifests
# must not restate versions.
async-channel = "2"
rand = "0.8"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

# Workspace-wide lint policy (ADR-0025). Every member inherits this table
# with `lints.workspace = true`; crates with no `unsafe` additionally carry
# `#![forbid(unsafe_code)]`, so its absence marks where review effort goes.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
