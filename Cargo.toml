[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.22"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/aegis-shell/xdg-desktop-portal-aegis"

[workspace.dependencies]
aegis-portal-ipc = { version = "=0.0.22", path = "crates/aegis-portal-ipc" }
aegis-portal-runtime = { version = "=0.0.22", path = "crates/aegis-portal-runtime" }
aegis-portal-prompter = { version = "=0.0.22", path = "crates/aegis-portal-prompter" }
aegis-portal-secret = { version = "=0.0.22", path = "crates/aegis-portal-secret" }

dirs = "5"
env_logger = "0.11"
# The FileChooser preview pane decodes image files in the prompter process
# (ADR-0017): only raster decoders are enabled, never the full default
# format set, so the decode surface stays small.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
# Everything below is inherited by more than one crate; deny.toml audits
# the workspace table as the single pinning point, so member manifests
# must not restate versions.
argon2 = "0.5"
async-channel = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
# The canonical build resolves the optics binding sources from the tagged
# monorepo release. Joint development against a sibling optics checkout uses
# .cargo/optics-local.toml without making the sibling checkout mandatory for
# CI (mirror of the Aegis workflow).
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.26" }
lens = { git = "https://github.com/ming2k/optics", tag = "v0.0.26" }
# Direct -sys dependencies are how the terminal binary sees the
# DEP_*_RPATHS metadata (published via the -sys crates' `links`) and can
# re-emit the loader paths itself; see aegis-portal-prompter/build.rs.
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.26" }
iris-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.26" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.26" }
libc = "0.2"
log = "0.4"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
