[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.38"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/atrium-desktop/xdg-desktop-portal-atrium"

[workspace.dependencies]
atrium-portal-ipc = { version = "=0.0.38", path = "crates/atrium-portal-ipc" }
atrium-portal-apps = { version = "=0.0.38", path = "crates/atrium-portal-apps" }
atrium-portal-cast = { version = "=0.0.38", path = "crates/atrium-portal-cast" }
atrium-portal-request = { version = "=0.0.38", path = "crates/atrium-portal-request" }
atrium-arca-contract = { version = "=0.0.38", path = "crates/atrium-arca-contract" }
atrium-portal-secret = { version = "=0.0.38", path = "crates/atrium-portal-secret" }

dirs = "5"
env_logger = "0.11"
# Everything below is inherited by more than one crate; deny.toml audits
# the workspace table as the single pinning point, so member manifests
# must not restate versions.
async-channel = "2"
# zbus 6 exposes its message stream through `futures_core::Stream`, so a
# consumer polls it with `StreamExt::next`.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.8"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
# zbus 6 absorbed zvariant, zvariant_derive, and zbus_names (RUSTSEC-2026-0370
# through -0372: all three are unmaintained as standalone crates). The blocking
# API is gone in 6.0, so every caller drives the async API through
# `zbus::block_on`; `default-rt` is what runs the connection's work on the
# calling thread between polls, which is what keeps this thread-per-interface
# daemon working without a shared runtime.
zbus = { version = "6", default-features = false, features = [
    "comms",
    "default-rt",
    "object-manager",
    "proxy",
    "service",
] }

# Workspace-wide lint policy (ADR-0025). Every member inherits this table
# with `lints.workspace = true`; crates with no `unsafe` additionally carry
# `#![forbid(unsafe_code)]`, so its absence marks where review effort goes.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
