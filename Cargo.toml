[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.32"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/atrium-desktop/xdg-desktop-portal-atrium"

[workspace.dependencies]
atrium-portal-ipc = { version = "=0.0.32", path = "crates/atrium-portal-ipc" }
atrium-portal-runtime = { version = "=0.0.32", path = "crates/atrium-portal-runtime" }
atrium-portal-prompter = { version = "=0.0.32", path = "crates/atrium-portal-prompter" }
atrium-portal-secret = { version = "=0.0.32", path = "crates/atrium-portal-secret" }

dirs = "5"
env_logger = "0.11"
# Everything below is inherited by more than one crate; deny.toml audits
# the workspace table as the single pinning point, so member manifests
# must not restate versions.
async-channel = "2"
rand = "0.8"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
