name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # EmbarkStudios/cargo-deny-action always builds the latest cargo-deny
      # (no version input), so install a pinned release instead. The
      # --all-features flag keeps parity with that action's defaults.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check dependencies
        run: cargo deny --all-features check
      - name: Check version consistency
        run: ./scripts/version-consistency.sh

  msrv:
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml selects `stable`; RUSTUP_TOOLCHAIN outranks it so
      # this job really runs the minimum supported toolchain below.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(scripts/optics-release-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libclang-dev libpam0g-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            meson ninja-build glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libfribidi-dev libxkbcommon-dev python3-pip
          # optics' meson.build requires >=1.8.0; Ubuntu 24.04's apt ships 1.3.2.
          sudo python3 -m pip install --break-system-packages 'meson>=1.8'
          # optics builds with c_std=c23; Ubuntu 24.04's GCC 13 has no
          # c23 mode, so compile the C libraries with Clang.
          sudo apt-get install -y clang
      - name: Build and install optics C libraries
        run: |
          CC=clang CXX=clang++ meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux lens iris
      - name: Check minimum supported Rust
        run: cargo check --locked --workspace --all-targets
      - name: Lint with minimum supported Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(scripts/optics-release-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview provides llvm-profdata for the Coverage step.
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dbus-daemon libclang-dev libpam0g-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            meson ninja-build glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libfribidi-dev libxkbcommon-dev \
            mesa-vulkan-drivers pipewire wireplumber \
            gstreamer1.0-pipewire gstreamer1.0-tools \
            xdg-desktop-portal xdg-utils python3-pip
          # optics' meson.build requires >=1.8.0; Ubuntu 24.04's apt ships 1.3.2.
          sudo python3 -m pip install --break-system-packages 'meson>=1.8'
          # optics builds with c_std=c23; Ubuntu 24.04's GCC 13 has no
          # c23 mode, so compile the C libraries with Clang.
          sudo apt-get install -y clang
      - name: Build and install optics C libraries
        run: |
          CC=clang CXX=clang++ meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux lens iris
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test
        env:
          ATRIUM_PORTAL_REQUIRE_E2E: "1"
          ATRIUM_PORTAL_REQUIRE_PIPEWIRE_E2E: "1"
        run: |
          cargo nextest run --profile ci --locked --workspace
          cargo test --doc --locked --workspace
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Release build
        run: cargo build --locked --release --workspace
      - name: Package staging
        run: |
          meson setup build-package --buildtype=release --prefix=/usr -Dpam=false
          meson compile -C build-package
          DESTDIR="$PWD/stage" meson install -C build-package
          test -x stage/usr/libexec/xdg-desktop-portal-atrium
          test -x stage/usr/libexec/atrium-portal-prompter
          grep -Fx 'Exec=/usr/libexec/xdg-desktop-portal-atrium' \
            stage/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.atrium.service
          test -z "$(find stage -path '*/security/pam_atrium.so' -print -quit)"

          meson setup build-package --reconfigure -Dpam=true
          meson compile -C build-package
          DESTDIR="$PWD/stage-pam" meson install -C build-package
          find stage-pam -path '*/security/pam_atrium.so' \
            -type f -perm /111 -print -quit | grep -q .
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Coverage
        env:
          ATRIUM_PORTAL_REQUIRE_E2E: "1"
          ATRIUM_PORTAL_REQUIRE_PIPEWIRE_E2E: "1"
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
          retention-days: 7
