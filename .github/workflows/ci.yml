name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check dependencies
        run: cargo deny --all-features check
      - name: Check version consistency
        run: ./scripts/version-consistency.sh

  msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config
      - name: Check minimum supported Rust
        run: cargo check --locked --workspace --all-targets
      - name: Lint with minimum supported Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dbus-daemon libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools \
            xdg-desktop-portal xdg-utils
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test
        env:
          ATRIUM_PORTAL_REQUIRE_E2E: "1"
          ATRIUM_PORTAL_REQUIRE_PIPEWIRE_E2E: "1"
        run: |
          cargo nextest run --profile ci --locked --workspace
          cargo test --doc --locked --workspace
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Release build
        run: cargo build --locked --release --workspace
      - name: Package staging
        run: |
          DESTDIR="$PWD/stage" ./scripts/install.sh --prefix /usr
          test -x stage/usr/libexec/xdg-desktop-portal-atrium
          grep -Fx 'Exec=/usr/libexec/xdg-desktop-portal-atrium' \
            stage/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.atrium.service
          test -z "$(find stage -path '*pam*' -print -quit)"
          test -f stage/usr/share/xdg-desktop-portal/tessera-portals.conf
          test -f stage/usr/share/xdg-desktop-portal/atrium-portals.conf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Coverage
        env:
          ATRIUM_PORTAL_REQUIRE_E2E: "1"
          ATRIUM_PORTAL_REQUIRE_PIPEWIRE_E2E: "1"
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
          retention-days: 7
